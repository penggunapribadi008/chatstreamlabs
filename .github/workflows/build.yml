name: Build installer Windows

# Dijalankan otomatis tiap ada push ke cabang main, atau manual lewat tab Actions > Run workflow.
# Hasilnya satu berkas .exe bernama chatstreamlab-v<versi>.exe (versi diambil dari package.json), tersedia di dua tempat:
#   1. Halaman Releases di repositori: unduh langsung berupa .exe (tanpa zip).
#   2. Tab Actions > proses yang selesai > Artifacts: juga .exe langsung, tidak dibungkus zip.
# Nama berkas diatur di package.json (build.nsis.artifactName). Naikkan "version" di package.json untuk tiap rilis baru.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Tes asap
        run: npm test
        continue-on-error: true   # tes yang gagal tidak menghalangi pembuatan installer

      - name: Buat installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # tanpa tanda tangan digital

      # Folder dist/ juga berisi uninstaller (__uninstaller-nsis-*.exe) dan berkas bantu.
      # Di sini kita ambil HANYA installer-nya, sesuai artifactName di package.json.
      - name: Tentukan berkas installer
        id: pack
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          FILE=$(node -p "const p=require('./package.json');'dist/'+p.build.nsis.artifactName.split('\${version}').join(p.version)")
          if [ ! -f "$FILE" ]; then echo "Installer tidak ditemukan: $FILE"; ls -la dist; exit 1; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Installer: $FILE"

      # archive: false = diunggah apa adanya (.exe), tidak dibungkus zip. Nama artefak otomatis = nama berkasnya.
      - name: Simpan installer sebagai artefak
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false
          if-no-files-found: error

      # Dibuat untuk setiap proses (bukan hanya tag), supaya .exe selalu bisa diunduh langsung dari Releases.
      - name: Lampirkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.ver }}
          name: v${{ steps.pack.outputs.ver }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.pack.outputs.file }}
          generate_release_notes: true
