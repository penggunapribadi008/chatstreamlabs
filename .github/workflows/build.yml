name: Build installer Windows

# Dijalankan otomatis tiap ada push ke cabang main, atau manual lewat tab Actions > Run workflow.
# Hasilnya satu berkas .exe bernama chatstreamlab-v<versi>.exe (versi diambil dari package.json).
#
# PENTING (v15.1.1): push biasa TIDAK membuat Release. Installer hanya tersedia untuk diuji di
#   Actions > proses yang selesai > Artifacts (.exe langsung, tidak dibungkus zip).
# Release (yang juga memicu auto-update ke semua pengguna) baru dibuat kalau KAMU sengaja memintanya:
#   - Actions > Build installer Windows > Run workflow > centang "Rilis ke Releases", atau
#   - push tag v<versi> (contoh: git tag v15.1.2 lalu git push origin v15.1.2).
# Nama berkas diatur di package.json (build.nsis.artifactName). Versi dipegang satu tempat: package.json
# (ganti lewat: node scripts/version.js set <versi>); workflow berhenti kalau ada tempat lain yang versinya beda.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Rilis ke Releases (auto-update untuk semua pengguna). Biarkan kosong untuk hanya menguji.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Versi harus sama di package.json, package-lock.json, dan extension/manifest.json (sidebar aplikasi ikut dari package.json saat build).
      - name: Cek versi sama di semua tempat
        shell: bash
        run: |
          node scripts/version.js check
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER=$(node -p "require('./package.json').version")
            if [ "$GITHUB_REF_NAME" != "v$VER" ]; then echo "Tag $GITHUB_REF_NAME tidak sama dengan versi aplikasi v$VER"; exit 1; fi
          fi

      - name: Pasang dependensi
        run: npm ci

      - name: Tes asap
        run: npm test
        continue-on-error: true   # tes yang gagal tidak menghalangi pembuatan installer

      - name: Buat installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # tanpa tanda tangan digital

      # Folder dist/ juga berisi uninstaller (__uninstaller-nsis-*.exe) dan berkas bantu.
      # Di sini kita ambil HANYA installer-nya, sesuai artifactName di package.json.
      - name: Tentukan berkas installer
        id: pack
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          FILE=$(node -p "const p=require('./package.json');'dist/'+p.build.nsis.artifactName.split('\${version}').join(p.version)")
          if [ ! -f "$FILE" ]; then echo "Installer tidak ditemukan: $FILE"; ls -la dist; exit 1; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Installer: $FILE"

      # Auto-update: electron-updater membaca latest.yml dari Releases. Tanpa berkas ini aplikasi tidak tahu ada versi baru.
      - name: Pastikan latest.yml ada
        shell: bash
        run: |
          if [ ! -f dist/latest.yml ]; then echo "dist/latest.yml tidak ada, auto-update tidak akan jalan"; ls -la dist; exit 1; fi
          cat dist/latest.yml

      # archive: false = diunggah apa adanya (.exe), tidak dibungkus zip. Nama artefak otomatis = nama berkasnya.
      - name: Simpan installer sebagai artefak
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false
          if-no-files-found: error

      # Hanya kalau sengaja diminta (tag v*, atau Run workflow dengan "Rilis ke Releases" dicentang). Push biasa berhenti di sini.
      - name: Lampirkan ke Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.ver }}
          name: v${{ steps.pack.outputs.ver }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.pack.outputs.file }}
            ${{ steps.pack.outputs.file }}.blockmap
            dist/latest.yml
          generate_release_notes: true
